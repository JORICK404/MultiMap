<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Карта сервера — Multi Punk</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#150C61">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=34">
</head>
<body>

<aside class="side" id="side">
  <button class="grab" id="grab" aria-label="Развернуть список"></button>
  <div class="brand"><img src="assets/logo.svg" alt="Multi Punk"><span>SMP 02</span><button class="theme acct" data-acct aria-label="Аккаунт"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></button><button class="theme" data-theme-toggle aria-label="Светлая или тёмная тема"><svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg></button></div>
  <div class="worlds">
    <button data-world="over">Верхний мир</button>
    <button data-world="nether">Ад · хайперлуп</button>
  </div>
  <div class="chips" id="layers"></div>

  <div class="scroll" id="scroll">
    <section><h3 class="title" id="gubTitle">Губернии</h3><div class="gubs" id="gubs"></div></section>
    <section>
      <h3 class="title" id="listTitle">Территории</h3>
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
        <input id="q" placeholder="Территория, владелец, житель" autocomplete="off" enterkeyhint="search" aria-label="Поиск">
      </label>
      <p class="found"><span id="found"></span><button id="clearFilter" hidden>сбросить</button></p>
      <button class="add" id="addPortal" hidden>+ Добавить портал</button>
      <div id="list"></div>
    </section>
  </div>
  <div class="foot" id="stamp"></div>
</aside>

<main class="map" id="map">
  <div class="view" id="view">
    <div class="frame" id="frame"></div>
    <div class="stage" id="stage"><div id="tiles"></div></div>
    <svg class="geo" id="geo" xmlns="http://www.w3.org/2000/svg"><g id="world"></g></svg>
    <div class="anchors" id="anchors"></div>
  </div>
  <div class="cross" id="cross"></div>

  <canvas class="ruler" id="rulerX"></canvas>
  <canvas class="ruler" id="rulerZ"></canvas>
  <div class="corner"></div>

  <div class="float topbar">
    <img src="assets/logo.svg" alt="Multi Punk">
    <button class="theme acct" data-acct aria-label="Аккаунт"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></button><button class="theme" data-theme-toggle aria-label="Светлая или тёмная тема"><svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg></button>
    <div class="worlds">
      <button data-world="over">Мир</button>
      <button data-world="nether">Ад</button>
    </div>
  </div>

  <div class="float hud" id="hud"></div>
  <div class="float scale"><span id="scaleLabel"></span><div id="scaleBar"></div></div>
  <div class="float zoom">
    <button id="zin" aria-label="Приблизить">+</button>
    <button id="zout" aria-label="Отдалить">−</button>
    <button id="zfit" aria-label="Показать весь мир">ВСЁ</button>
  </div>

  <div class="tip" id="tip" hidden></div>
</main>

<div class="card" id="card" hidden></div>
<div class="dlg" id="auth" hidden><div class="dlg-box" id="authBox"></div></div>

<script src="app.js?v=32"></script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
