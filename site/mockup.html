<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Карта сервера — Multi Punk (макет)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#150C61">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Цвета и формы — с multi-punk.net: тёмный индиго, мятный акцент,
   карточки с толстой светлой рамкой, градиентная полоска под заголовком. */
:root {
  --bg: #150C61;
  --bg-deep: #0D0745;
  --surface: #1E1389;
  --grad: linear-gradient(100deg, #1B107C 1%, #2E22C9 100%);
  --text: #DEFFEA;
  --muted: #A5A0EE;
  --accent: #76FFAA;
  --cyan: #65D6FF;
  --line: rgba(222, 255, 234, .16);
  --bar: linear-gradient(90deg, #76FFAA 0%, #65D6FF 45%, #DEFFEA 100%);
  --hover: #271AA8;
  --zero: #76FFAA;
  --icon: #76FFAA;
  --logo: brightness(0) invert(1);
  --nether: #1E0A0D;
  --ruler: 22px;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
}
:root[data-theme="light"] {
  --bg: #FFFFFF;
  --bg-deep: #F1F2FB;
  --surface: #F1F2FB;
  --text: #3530C8;
  --muted: #5798FA;
  --cyan: #5798FA;
  --line: rgba(53, 48, 200, .16);
  --bar: linear-gradient(90deg, #76FFAA 0%, #65D6FF 45%, #3530C8 100%);
  --hover: #E3E5F8;
  --zero: #3530C8;
  --icon: #3530C8;
  --logo: none;
}
/* Карточка и в светлой теме остаётся тёмно-синей внутри, как карточки на сайте. */
:root[data-theme="light"] .card, :root[data-theme="light"] .dlg-box {
  --text: #FFFFFF; --muted: #B9B6F5; --cyan: #65D6FF; --line: rgba(255, 255, 255, .18);
  --bar: linear-gradient(90deg, #76FFAA 0%, #65D6FF 45%, #FFFFFF 100%);
  color: #fff; border-color: #3530C8;
}
:root[data-theme="light"] .map:not(.nether) { background: #FFFFFF; }
:root[data-theme="light"] .g-name.top, :root[data-theme="light"] .g-name.bot { color: var(--text); text-shadow: none; }
:root[data-theme="light"] .g-name.top::before, :root[data-theme="light"] .g-name.bot::before {
  content: ''; display: inline-block; width: .7em; height: .7em; margin-right: .45em; border-radius: 3px; background: var(--c);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overscroll-behavior: none; }
body {
  display: grid; grid-template-columns: 350px 1fr;
  height: 100dvh; overflow: hidden;
  background: var(--bg-deep); color: var(--text);
  font: 500 14px/1.4 Montserrat, system-ui, sans-serif;
  -webkit-text-size-adjust: 100%;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
[hidden] { display: none !important; }

/* ---------- общие детали ---------- */
.title { margin: 0 0 10px; font-size: 13px; font-weight: 700; }
.title::after { content: ''; display: block; height: 5px; margin-top: 6px; border-radius: 3px; background: var(--bar); }

.worlds { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--bg-deep); border-radius: 8px; }
.worlds button { padding: 9px 10px; border-radius: 5px; text-align: center; font-weight: 700; color: var(--muted); white-space: nowrap; }
.worlds button[aria-pressed="true"] { background: var(--accent); color: #000; }

/* ---------- панель: слева на компьютере, шторка снизу на телефоне ---------- */
.side {
  display: flex; flex-direction: column; min-height: 0;
  background: var(--bg); border-right: 3px solid var(--text); z-index: 20;
}
.grab { display: none; }
.brand { display: flex; align-items: center; gap: 10px; padding: 12px 12px 12px 18px; }
.brand img, .topbar img { height: 18px; display: block; filter: var(--logo); }
.theme { flex: none; width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; color: var(--text); }
.theme:hover { background: var(--surface); }
.theme svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.theme .moon, :root[data-theme="light"] .theme .sun { display: none; }
:root[data-theme="light"] .theme .moon { display: block; }
.brand span { margin-left: auto; font: 500 11px var(--mono); color: var(--muted); }
.side > .worlds { margin: 0 18px; }

.search { padding: 12px 18px 0; }
.search input {
  width: 100%; height: 44px; padding: 0 14px;
  background: var(--surface); border: 2px solid transparent; border-radius: 8px; outline: none; font-weight: 700;
}
.search input::placeholder { color: var(--muted); font-weight: 500; }
.search input:focus { border-color: var(--accent); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 18px 12px; }
.chip {
  display: flex; align-items: center; gap: 7px; flex: none;
  height: 34px; padding: 0 12px; border-radius: 5px;
  background: var(--accent); color: #000; font-size: 13px; font-weight: 700; white-space: nowrap;
}
.chip i { font: 500 11px var(--mono); font-style: normal; opacity: .6; }
.chip[aria-pressed="false"] { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 2px var(--line); }

.scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 6px 18px calc(18px + var(--safe-b)); border-top: 1px solid var(--line); }
.scroll section { padding-top: 12px; }

/* Плитки 2×2 лежат так же, как губернии на карте. */
.gubs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.gub {
  display: grid; gap: 2px; padding: 9px 12px 10px; min-height: 52px;
  background: var(--surface); border-radius: 8px; border: 2px solid transparent; border-left: 6px solid var(--c);
  font-weight: 700;
}
.gub small { font: 500 11px var(--mono); color: var(--muted); }
.gub[aria-pressed="true"] { border-color: var(--c); background: var(--bg-deep); }

.found { display: flex; justify-content: space-between; margin: 0 0 6px; font: 500 11px var(--mono); color: var(--muted); }
.found button { color: var(--accent); }
.item {
  display: grid; grid-template-columns: 6px 1fr auto; gap: 1px 12px; align-items: center;
  width: 100%; min-height: 54px; padding: 8px 12px 8px 0; margin-bottom: 6px;
  background: var(--surface); border-radius: 8px; overflow: hidden;
}
.item::before { content: ''; grid-row: 1 / 3; align-self: stretch; margin: -8px 0; background: var(--c); }
.item strong { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item span { grid-column: 2; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item em { grid-row: 1 / 3; grid-column: 3; font: 500 11px/1.5 var(--mono); color: var(--cyan); font-style: normal; text-align: right; }
.item:hover { background: var(--hover); }
.empty { padding: 18px 0; color: var(--muted); }
.foot { padding: 10px 18px; border-top: 1px solid var(--line); font: 500 10px/1.5 var(--mono); color: var(--muted); }

/* ---------- карта ---------- */
.map { position: relative; overflow: hidden; background: var(--bg-deep); min-width: 0; }
.map.nether { background: var(--nether); }
.view { position: absolute; inset: 0; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
.view.dragging { cursor: grabbing; }
.stage { position: absolute; top: 0; left: 0; transform-origin: 0 0; background-size: 100% 100%; }
.map.nether .stage { box-shadow: 0 0 0 3px var(--text); }
/* Рамка как у карты в Майнкрафте: больше сцены на 5% с каждой стороны, середина скрыта под картой. */
.frame { position: absolute; top: 0; left: 0; background: url('assets/map_frame.svg') 0 0 / 100% 100% no-repeat; image-rendering: pixelated; pointer-events: none; }
.map.nether .frame { display: none; }
.map.nether .stage {
  background-color: #2B0E12;
  background-image: linear-gradient(rgba(255,120,90,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(255,120,90,.07) 1px, transparent 1px);
}
.tile { position: absolute; background-size: 100% 100%; image-rendering: pixelated; }
svg.geo { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
svg.geo * { vector-effect: non-scaling-stroke; }
.t-case { fill: none; stroke: rgba(13,7,69,.7); stroke-width: 4; pointer-events: none; }
.t-rect { stroke-width: 1.5; cursor: pointer; shape-rendering: crispEdges; }
.t-rect:hover, .t-rect.sel { stroke: #fff; stroke-width: 2.5; }
.g-tint { pointer-events: none; }
.g-corner { fill: none; stroke-width: 6; stroke-linejoin: miter; stroke-linecap: butt; pointer-events: none; }
.g-axis { stroke: #DEFFEA; stroke-width: 1.5; stroke-dasharray: 10 6; opacity: .8; pointer-events: none; }
.l-case { fill: none; stroke: #12060A; stroke-width: 11; stroke-linejoin: round; stroke-linecap: round; pointer-events: none; }
.l-line { fill: none; stroke-width: 6; stroke-linejoin: round; stroke-linecap: round; pointer-events: none; }
.l-spur { stroke-width: 3; }
.l-spur.l-case { stroke-width: 7; }

.anchors { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.a { position: absolute; width: 0; height: 0; }
.g-name {
  position: absolute; transform: translate(-50%, -50%); white-space: nowrap; text-align: center;
  font-size: 20px; font-weight: 800; line-height: 1; letter-spacing: .08em; text-transform: uppercase; color: #fff;
  text-shadow: 0 0 3px #0D0745, 0 2px 8px rgba(13,7,69,.9); transition: opacity .2s;
}
.g-name.top { transform: translate(-50%, calc(-100% - 12px)); color: var(--c); }
.g-name.bot { transform: translate(-50%, 12px); color: var(--c); }
.g-name.end { font-size: 13px; letter-spacing: .06em; color: var(--c); text-shadow: 0 0 3px #12060A; }

.pin { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; cursor: pointer; }
.pin::before { content: ''; position: absolute; inset: -12px; }
.boss { width: 28px; height: 28px; border-radius: 6px; background: var(--bg); box-shadow: 0 0 0 3px var(--text); transform: translate(-50%, -50%) rotate(45deg); display: grid; place-items: center; }
.boss svg { width: 17px; height: 17px; transform: rotate(-45deg); fill: var(--icon); }
.boss:hover, .boss.sel { background: var(--accent); }
.boss:hover svg, .boss.sel svg { fill: #000; }
.exit { width: 8px; height: 11px; border-radius: 2px; background: #8B4DFF; box-shadow: 0 0 0 2px var(--c), 0 0 0 4px rgba(13,7,69,.7); }
.exit:hover, .exit.sel { box-shadow: 0 0 0 2px #fff, 0 0 0 4px rgba(13,7,69,.7); }
.station { width: 14px; height: 14px; border-radius: 4px; background: #fff; box-shadow: 0 0 0 3px var(--c), 0 0 0 6px #12060A; }
.station.hub { width: 24px; height: 24px; border-radius: 6px; background: #12060A; box-shadow: 0 0 0 3px #fff; }
.station:hover, .station.sel { background: var(--c); }
.cap {
  position: absolute; left: 16px; top: -8px; white-space: nowrap; pointer-events: none;
  font-size: 12px; font-weight: 700; line-height: 1.2; color: #fff;
  text-shadow: 0 0 3px #000, 0 1px 4px rgba(0,0,0,.9);
}
.cap small { display: block; font: 500 10px var(--mono); opacity: .75; }
.cap.below { left: 0; top: 24px; transform: translateX(-50%); text-align: center; }
.spawn { position: absolute; width: 10px; height: 10px; border-radius: 2px; background: var(--accent); box-shadow: 0 0 0 3px var(--bg); transform: translate(-50%, -50%) rotate(45deg); }
.cross { position: absolute; z-index: 3; width: 18px; height: 18px; margin: -9px 0 0 -9px; pointer-events: none; display: none;
  background: linear-gradient(#fff, #fff) center / 2px 100% no-repeat, linear-gradient(#fff, #fff) center / 100% 2px no-repeat; filter: drop-shadow(0 0 2px #000); }

canvas.ruler { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 3; }
.corner { position: absolute; top: 0; left: 0; width: var(--ruler); height: var(--ruler); background: var(--bg); z-index: 4; }

.float { position: absolute; z-index: 5; background: var(--bg); border: 2px solid var(--text); border-radius: 8px; }
.hud { left: calc(var(--ruler) + 12px); bottom: 12px; padding: 7px 11px; font: 500 12px/1.5 var(--mono); pointer-events: none; white-space: pre; }
.hud span { color: var(--muted); }
.scale { right: 66px; bottom: 12px; padding: 5px 9px 7px; pointer-events: none; text-align: right; font: 500 11px var(--mono); }
.scale div { height: 6px; margin-top: 3px; border: solid var(--text); border-width: 0 2px 2px; }
.zoom { right: 12px; bottom: 12px; display: grid; overflow: hidden; }
.zoom button { width: 40px; height: 40px; text-align: center; font-size: 20px; font-weight: 700; }
.zoom button + button { border-top: 1px solid var(--line); }
.zoom button:hover { background: var(--surface); }
.zoom button:last-child { font-size: 10px; font-weight: 800; }
.topbar { display: none; }
.demo { position: absolute; z-index: 5; bottom: 14px; left: 50%; transform: translateX(-50%); padding: 5px 10px; border-radius: 5px; background: #FFE45C; color: #000; font: 500 11px var(--mono); white-space: nowrap; }

.tip { position: absolute; z-index: 6; pointer-events: none; padding: 6px 10px; border-radius: 6px; background: var(--bg); box-shadow: 0 0 0 2px var(--text); font-size: 12px; font-weight: 700; white-space: nowrap; transform: translate(14px, 16px); }
.tip small { display: block; font: 500 10px var(--mono); color: var(--muted); }

/* ---------- карточка объекта ---------- */
.card {
  position: absolute; z-index: 30; top: calc(var(--ruler) + 12px); right: 12px;
  width: 330px; max-height: calc(100% - var(--ruler) - 76px);
  display: flex; flex-direction: column; overflow: hidden;
  background: var(--grad); border: 3px solid var(--text); border-radius: 12px;
}
.card header { position: relative; padding: 14px 16px 12px; }
.card .tag { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; color: var(--muted); }
.card .tag::before { content: ''; width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.card h2 { margin: 6px 40px 0 0; font-size: 22px; font-weight: 800; line-height: 1.15; overflow-wrap: anywhere; }
.card h2::after { content: ''; display: block; height: 5px; margin-top: 10px; margin-right: -40px; border-radius: 3px; background: var(--bar); }
.card .x { position: absolute; top: 8px; right: 8px; width: 44px; height: 44px; text-align: center; font-size: 18px; color: var(--text); }
.card .body { overflow-y: auto; min-height: 0; overscroll-behavior: contain; padding: 0 16px 6px; }
.card p { margin: 0 0 12px; }
.card dl { margin: 0 0 6px; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; padding: 12px; background: rgba(13,7,69,.45); border-radius: 8px; }
.card dt, .card dd { margin: 0; }
.card dt { color: var(--muted); font-size: 12px; }
.card dd { font: 500 12px/1.5 var(--mono); text-align: right; color: var(--cyan); }
.card h4 { margin: 12px 0 4px; font-size: 12px; font-weight: 700; color: var(--muted); }
.card ul { margin: 0; padding: 0; list-style: none; }
.card li { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); font-weight: 700; }
.card li:first-child { border-top: 0; }
.card li span { color: var(--muted); font-weight: 500; font-size: 12px; }
.card footer { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px 16px calc(14px + var(--safe-b)); }
.card footer button { height: 44px; border-radius: 5px; text-align: center; font-size: 13px; font-weight: 700; box-shadow: inset 0 0 0 2px var(--text); }
.card footer button:first-child { background: var(--accent); color: #000; box-shadow: none; }

/* ---------- вход ---------- */
.acct img { width: 26px; height: 26px; border-radius: 6px; display: block; }
.acct.in { box-shadow: inset 0 0 0 2px var(--accent); }
.dlg { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 16px; background: rgba(13, 7, 69, .6); }
.dlg-box { position: relative; width: min(100%, 360px); padding: 20px; background: var(--grad); border: 3px solid var(--text); border-radius: 12px; }
.dlg-box h2 { margin: 0 40px 0 0; font-size: 22px; font-weight: 800; }
.dlg-box h2::after { content: ''; display: block; height: 5px; margin: 10px -40px 0 0; border-radius: 3px; background: var(--bar); }
.dlg-box p { margin: 14px 0; }
.dlg-box .x { position: absolute; top: 8px; right: 8px; width: 44px; height: 44px; text-align: center; font-size: 18px; }
.dlg-box .note { font-size: 12px; color: var(--muted); }
.dlg-box .err { padding: 8px 12px; border-radius: 6px; background: rgba(255, 90, 82, .25); }
.way { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 46px; margin-top: 8px; border-radius: 5px; font-weight: 700; text-decoration: none; text-align: center; }
.way.discord { background: #5865F2; color: #fff; }
.way.main { background: var(--accent); color: #000; }
.way.off { box-shadow: inset 0 0 0 2px var(--line); color: var(--muted); cursor: default; }
#tgSlot { display: grid; place-items: center; min-height: 46px; margin-top: 8px; }
.who { display: flex; align-items: center; gap: 12px; margin: 16px 0; }
.who img { width: 48px; height: 48px; border-radius: 8px; }
.who b { display: block; font-size: 16px; }
.who span { font-size: 12px; color: var(--muted); }

/* ================= ТЕЛЕФОН ================= */
@media (max-width: 820px) {
  body { display: block; }
  .map { position: fixed; inset: 0; }
  canvas.ruler, .corner, .scale, .demo, .brand, .side > .worlds, .foot, .zoom button:not(:last-child) { display: none; }
  :root { --ruler: 0px; }

  .topbar {
    display: flex; align-items: center; gap: 10px;
    left: 10px; right: 10px; top: calc(10px + var(--safe-t)); padding: 5px 5px 5px 12px;
  }
  .topbar .acct { margin-left: auto; }
  .topbar { gap: 4px; }
  .topbar .worlds { margin-left: 4px; }
  .topbar .worlds button { padding: 8px 14px; font-size: 13px; }
  .hud { left: 10px; top: calc(72px + var(--safe-t)); bottom: auto; padding: 5px 9px; font-size: 11px; }
  .cross { display: block; }
  .zoom { right: 10px; bottom: calc(var(--peek, 150px) + 12px); }
  .zoom button { width: 48px; height: 48px; }
  body.has-card .zoom { display: none; }
  .g-name { font-size: 14px; }
  .g-name.top { transform: translate(-50%, calc(-100% - 8px)); }
  .g-name.bot { transform: translate(-50%, 8px); }

  /* Шторка: три положения — «ручка + поиск + слои», половина экрана, весь экран. */
  .side {
    position: fixed; left: 0; right: 0; bottom: 0;
    height: calc(100dvh - 68px - var(--safe-t));
    border: 3px solid var(--text); border-bottom: 0; border-radius: 16px 16px 0 0;
    transform: translateY(var(--y, 70%)); transition: transform .24s cubic-bezier(.2, .8, .2, 1);
    will-change: transform;
  }
  .side.dragging { transition: none; }
  body.has-card .side { transform: translateY(105%); }
  .grab { display: block; flex: none; width: 100%; height: 26px; touch-action: none; cursor: grab; }
  .grab::before { content: ''; display: block; width: 44px; height: 5px; margin: 9px auto 0; border-radius: 3px; background: var(--text); opacity: .55; }
  .search { padding: 0 12px; }
  .chips { flex-wrap: nowrap; overflow-x: auto; padding: 10px 12px 12px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { height: 38px; }
  .scroll { padding-inline: 12px; }

  .card {
    position: fixed; top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 58dvh;
    border-bottom: 0; border-radius: 16px 16px 0 0;
    animation: up .22s cubic-bezier(.2, .8, .2, 1);
  }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<aside class="side" id="side">
  <button class="grab" id="grab" aria-label="Развернуть список"></button>
  <div class="brand"><img src="assets/logo.svg" alt="Multi Punk"><span>SMP 02</span><button class="theme acct" data-acct aria-label="Аккаунт"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></button><button class="theme" data-theme-toggle aria-label="Светлая или тёмная тема"><svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg></button></div>
  <div class="worlds">
    <button data-world="over">Верхний мир</button>
    <button data-world="nether">Ад · хайперлуп</button>
  </div>
  <div class="search"><input id="q" placeholder="Территория, владелец, житель" autocomplete="off" enterkeyhint="search"></div>
  <div class="chips" id="layers"></div>

  <div class="scroll" id="scroll">
    <section><h3 class="title" id="gubTitle">Губернии</h3><div class="gubs" id="gubs"></div></section>
    <section>
      <h3 class="title" id="listTitle">Территории</h3>
      <p class="found"><span id="found"></span><button id="clearFilter" hidden>сбросить</button></p>
      <div id="list"></div>
    </section>
  </div>
  <div class="foot" id="stamp"></div>
</aside>

<main class="map" id="map">
  <div class="view" id="view">
    <div class="frame" id="frame"></div>
    <div class="stage" id="stage"><div id="tiles"></div></div>
    <svg class="geo" id="geo" xmlns="http://www.w3.org/2000/svg"><g id="world"></g></svg>
    <div class="anchors" id="anchors"></div>
  </div>
  <div class="cross" id="cross"></div>

  <canvas class="ruler" id="rulerX"></canvas>
  <canvas class="ruler" id="rulerZ"></canvas>
  <div class="corner"></div>

  <div class="float topbar">
    <img src="assets/logo.svg" alt="Multi Punk">
    <button class="theme acct" data-acct aria-label="Аккаунт"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></button><button class="theme" data-theme-toggle aria-label="Светлая или тёмная тема"><svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg></button>
    <div class="worlds">
      <button data-world="over">Мир</button>
      <button data-world="nether">Ад</button>
    </div>
  </div>

  <div class="float hud" id="hud"></div>
  <div class="float scale"><span id="scaleLabel"></span><div id="scaleBar"></div></div>
  <div class="float zoom">
    <button id="zin" aria-label="Приблизить">+</button>
    <button id="zout" aria-label="Отдалить">−</button>
    <button id="zfit" aria-label="Показать весь мир">ВСЁ</button>
  </div>

  <div class="tip" id="tip" hidden></div>
</main>

<div class="card" id="card" hidden></div>
<div class="dlg" id="auth" hidden><div class="dlg-box" id="authBox"></div></div>

<script>
/* ============ данные ============ */

// sx/sz — знак X и Z четверти (в Minecraft север — это −Z, то есть верх карты).
const GUBS = [
  { id: 'green',  name: 'Зелёная', color: '#3DDC6B', sx: -1, sz: -1 },
  { id: 'red',    name: 'Красная', color: '#FF5A52', sx:  1, sz: -1 },
  { id: 'yellow', name: 'Жёлтая',  color: '#FFD23F', sx: -1, sz:  1 },
  { id: 'blue',   name: 'Синяя',   color: '#4FA3FF', sx:  1, sz:  1 },
];
const gubOf = (x, z) => GUBS.find(g => (x < 0 ? -1 : 1) === g.sx && (z < 0 ? -1 : 1) === g.sz);
const colorOf = id => GUBS.find(g => g.id === id).color;

// Магистрали хайперлупа: от спавна в четыре стороны.
const LINES = [
  { id: 'red',    name: 'Красная', dir: 'на север',  dx:  0, dz: -1 },
  { id: 'blue',   name: 'Синяя',   dir: 'на восток', dx:  1, dz:  0 },
  { id: 'yellow', name: 'Жёлтая',  dir: 'на юг',     dx:  0, dz:  1 },
  { id: 'green',  name: 'Зелёная', dir: 'на запад',  dx: -1, dz:  0 },
].map(l => ({ ...l, color: colorOf(l.id) }));

const BOSSES = [
  { name: 'Тотемник', x: -1866, z: 243 },
  { name: 'Флейтист', x: 1291, z: 498 },
  { name: 'Склеп', x: 45, z: -1265 },
];

const ROLES = { owner: 'владелец', sherif: 'шериф', resident: 'житель' };
const WORLDS = { over: { half: 3000, size: 6001, maxK: 8 }, nether: { half: 375, size: 751, maxK: 24 } };
const MAP_DIR = 'assets/map/';
const FRAME_OUT = .065;   // отступ подписи губернии от карты, в долях полумира
const EXIT_MIN_K = .55;   // выходы хайперлупа на верхней карте видны только вблизи
let TILE = 512, MAP_VERSION = 0;

let territories = [], stations = [];

/* ============ состояние ============ */

let world = 'over';
const layers = { gub: true, terr: true, boss: true, loop: true };
const LAYER_NAMES = { gub: 'Губернии', terr: 'Территории', boss: 'Боссы', loop: 'Порталы' };
let groupFilter = null, selected = null;
const view = { k: 1, tx: 0, ty: 0, fitK: 1 };
const anchors = [];
const registry = new Map();

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const W = () => WORLDS[world];
const px = v => v + W().half;
const num = n => String(Math.round(n)).replace('-', '−');
const SVG = 'http://www.w3.org/2000/svg';
const mq = matchMedia('(max-width: 820px)');
const mobile = () => mq.matches;
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

/* ============ тема ============ */

function setTheme(t) {
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name="theme-color"]').content = t === 'light' ? '#FFFFFF' : '#150C61';
  try { localStorage.setItem('theme', t); } catch (e) {}
}
{
  let saved = null;
  try { saved = localStorage.getItem('theme'); } catch (e) {}
  setTheme(saved === 'light' ? 'light' : 'dark');
}

/* ============ подготовка данных ============ */

function buildTerritory(raw, i) {
  const rects = raw.regions.map(r => ({
    x1: Math.min(r.firstPoint.x, r.secondPoint.x), x2: Math.max(r.firstPoint.x, r.secondPoint.x),
    z1: Math.min(r.firstPoint.z, r.secondPoint.z), z2: Math.max(r.firstPoint.z, r.secondPoint.z),
  }));
  const b = rects.reduce((a, r) => ({
    x1: Math.min(a.x1, r.x1), x2: Math.max(a.x2, r.x2), z1: Math.min(a.z1, r.z1), z2: Math.max(a.z2, r.z2),
  }));
  const cx = Math.round((b.x1 + b.x2) / 2), cz = Math.round((b.z1 + b.z2) / 2);
  const owner = raw.residents.find(r => r.status === 'owner') || raw.residents[0];
  return {
    key: 't:' + i, type: 'terr', name: (raw.name || 'Без названия').trim(), about: raw.description || '',
    rects, b, cx, cz, owner: owner ? owner.name : '—', residents: raw.residents,
    group: raw.name === 'Спавн' ? null : gubOf(cx, cz),
    hay: [raw.name, ...raw.residents.map(r => r.name)].join(' ').toLowerCase(),
  };
}

// ПРИМЕР станций, пока нет настоящих: ответвления к самым населённым
// территориям вдоль каждой магистрали. Координаты станции — в аду (÷8).
function buildDemoLoop() {
  stations = [{ key: 's:hub', type: 'station', name: 'Спавн', x: 0, z: 0, hub: true, group: null }];
  LINES.forEach(l => {
    const along = t => t.cx * l.dx + t.cz * l.dz, off = t => Math.abs(t.cx * l.dz) + Math.abs(t.cz * l.dx);
    const picked = [];
    territories.filter(t => t.group && along(t) > 350 && along(t) > off(t))
      .sort((a, b) => b.residents.length - a.residents.length)
      .forEach(t => { if (picked.length < 5 && picked.every(p => Math.abs(along(p) - along(t)) > 300)) picked.push(t); });
    picked.sort((a, b) => along(a) - along(b)).forEach((t, i) => stations.push({
      key: `s:${l.id}${i}`, type: 'station', group: l,
      name: t.name.length > 22 ? t.name.slice(0, 21) + '…' : t.name,
      x: Math.round(t.cx / 8), z: Math.round(t.cz / 8),
    }));
  });
}

/* ============ отрисовка ============ */

function el(tag, attrs, parent) {
  const n = document.createElementNS(SVG, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  parent.appendChild(n);
  return n;
}

function anchor(x, z, html, opts = {}) {
  const a = document.createElement('div');
  a.className = 'a';
  a.innerHTML = html;
  $('anchors').appendChild(a);
  anchors.push({ el: a, x: px(x), z: px(z), ...opts });
  return a;
}

const SKULL = '<svg viewBox="0 0 16 16"><path d="M3 2h10v2h1v6h-2v2h-1v2H5v-2H4v-2H2V4h1zM5 6v3h2V6zm4 0v3h2V6zM7 10v1h2v-1z"/></svg>';

function rebuild() {
  const g = $('world'), half = W().half, size = W().size;
  g.innerHTML = ''; $('anchors').innerHTML = ''; anchors.length = 0; registry.clear();
  $('map').classList.toggle('nether', world === 'nether');

  if (layers.gub || world === 'nether') {
    GUBS.forEach(q => {
      el('rect', {
        class: 'g-tint', fill: q.color, 'fill-opacity': world === 'nether' ? .05 : .14,
        x: q.sx < 0 ? 0 : half, y: q.sz < 0 ? 0 : half, width: half + (q.sx > 0 ? 1 : 0), height: half + (q.sz > 0 ? 1 : 0),
      }, g);
      if (world === 'over') {
                // Уголок — по краю самой карты, внутри рамки; подпись — за рамкой.
        const o = half * FRAME_OUT, arm = 0;   // 0 — уголок тянется до середины стороны, half — исчезает
        const cx = q.sx < 0 ? 0 : size, cz = q.sz < 0 ? 0 : size;
        el('path', { class: 'g-corner', stroke: q.color, d: `M${px(q.sx * arm)} ${cz}H${cx}V${px(q.sz * arm)}` }, g);
        anchor(q.sx * half * .5, q.sz * (half + o),
          `<div class="g-name ${q.sz < 0 ? 'top' : 'bot'}" style="--c:${q.color}">${q.name}</div>`);
      }
    });
    if (world === 'over') el('path', { class: 'g-axis', d: `M0 ${half}H${size}M${half} 0V${size}` }, g);
  }

  if (world === 'over') {
    if (layers.terr) territories.forEach(t => {
      const c = t.group ? t.group.color : '#fff';
      t.rects.forEach(r => {
        const box = { x: px(r.x1), y: px(r.z1), width: r.x2 - r.x1 + 1, height: r.z2 - r.z1 + 1 };
        el('rect', { class: 't-case', ...box }, g);
        el('rect', { class: 't-rect', ...box, stroke: c, fill: c, 'fill-opacity': .18, 'data-sel': t.key }, g);
      });
      registry.set(t.key, t);
    });
    if (layers.loop) stations.filter(s => !s.hub).forEach(s => {
      const o = { ...s, key: 'e' + s.key, type: 'exit', nx: s.x, nz: s.z, x: s.x * 8, z: s.z * 8 };
      anchor(o.x, o.z, `<div class="pin exit" style="--c:${s.group.color}" data-sel="${o.key}"></div>`, { minK: EXIT_MIN_K });
      registry.set(o.key, o);
    });
    if (layers.boss) BOSSES.forEach((b, i) => {
      const o = { ...b, key: 'b:' + i, type: 'boss', group: gubOf(b.x, b.z) };
      anchor(b.x, b.z, `<div class="pin boss" data-sel="${o.key}">${SKULL}</div><div class="cap below">${esc(b.name)}</div>`);
      registry.set(o.key, o);
    });
    anchor(0, 0, '<div class="spawn"></div><div class="cap">Спавн</div>');
  } else {
    // Магистраль идёт по оси от спавна, к каждой станции — ответвление под прямым углом.
    LINES.forEach(l => {
      const stops = stations.filter(s => s.group === l);
      const reach = Math.max(120, ...stops.map(s => s.x * l.dx + s.z * l.dz)) + 30;
      const trunk = `M${px(0)} ${px(0)}L${px(l.dx * reach)} ${px(l.dz * reach)}`;
      const spurs = stops.map(s => `M${px(l.dx ? s.x : 0)} ${px(l.dz ? s.z : 0)}L${px(s.x)} ${px(s.z)}`).join('');
      el('path', { class: 'l-case', d: trunk }, g);
      el('path', { class: 'l-case l-spur', d: spurs }, g);
      el('path', { class: 'l-line l-spur', d: spurs, stroke: l.color }, g);
      el('path', { class: 'l-line', d: trunk, stroke: l.color }, g);
      anchor(l.dx * (reach + 26), l.dz * (reach + 14), `<div class="g-name end" style="--c:${l.color}">${l.name}</div>`);
    });
    stations.forEach(s => {
      anchor(s.x, s.z, `<div class="pin station${s.hub ? ' hub' : ''}" style="--c:${s.group ? s.group.color : '#fff'}" data-sel="${s.key}"></div>` +
        `<div class="cap">${esc(s.name)}<small>${num(s.x)} / ${num(s.z)}</small></div>`);
      registry.set(s.key, s);
    });
  }
  markSelected();
  apply();
}

function markSelected() {
  document.querySelectorAll('.sel').forEach(n => n.classList.remove('sel'));
  if (selected) document.querySelectorAll(`[data-sel="${selected.key}"]`).forEach(n => n.classList.add('sel'));
}

/* ============ камера ============ */

const rect = () => $('view').getBoundingClientRect();

// Часть карты, не закрытая интерфейсом: всё центрируется относительно неё.
function insets() {
  if (!mobile()) return { l: 22, t: 22, r: 0, b: 0 };
  const card = $('card');
  return { l: 0, t: 64, r: 0, b: card.hidden ? peekH() : card.offsetHeight };
}
function center() {
  const r = rect(), i = insets();
  return { x: i.l + (r.width - i.l - i.r) / 2, y: i.t + (r.height - i.t - i.b) / 2 };
}

function fitK(x1, z1, x2, z2) {
  const r = rect(), i = insets(), pad = mobile() ? 10 : 24;
  return Math.min((r.width - i.l - i.r - pad * 2) / (x2 - x1), (r.height - i.t - i.b - pad * 2) / (z2 - z1));
}
// Весь мир вместе с рамкой и подписями губерний вокруг неё.
function worldFitK() {
  const h = W().half, mx = world === 'over' ? h * .09 : 0, mz = world === 'over' ? h * .16 : 0;
  return fitK(-h - mx, -h - mz, h + 1 + mx, h + 1 + mz);
}
function fitTo(x1, z1, x2, z2, maxK) {
  goto((x1 + x2) / 2, (z1 + z2) / 2, Math.min(fitK(x1, z1, x2, z2), maxK || Infinity));
}
function fit() {
  view.fitK = worldFitK();
  goto(.5, .5, view.fitK);
}
function goto(x, z, k) {
  const c = center();
  if (k) view.k = k;
  view.tx = c.x - px(x) * view.k;
  view.ty = c.y - px(z) * view.k;
  apply();
}

function zoomAt(sx, sy, f) {
  const next = Math.max(view.fitK * .7, Math.min(W().maxK, view.k * f)), ratio = next / view.k;
  view.tx = sx - (sx - view.tx) * ratio;
  view.ty = sy - (sy - view.ty) * ratio;
  view.k = next;
  apply();
}

function apply() {
  const r = rect(), s = W().size * view.k, c = center();
  view.tx = Math.min(c.x, Math.max(c.x - s, view.tx));
  view.ty = Math.min(c.y, Math.max(c.y - s, view.ty));

  const st = $('stage').style;
  st.width = st.height = s + 'px';
  st.transform = `translate(${view.tx}px, ${view.ty}px)`;
  const fr = $('frame').style;
  fr.width = fr.height = s * 1.1 + 'px';
  fr.transform = `translate(${view.tx - s * .05}px, ${view.ty - s * .05}px)`;
  if (world === 'nether') st.backgroundSize = `${16 * view.k}px ${16 * view.k}px`;
  $('world').setAttribute('transform', `translate(${view.tx} ${view.ty}) scale(${view.k})`);

  const far = view.k < view.fitK * 2.6;
  anchors.forEach(a => {
    a.el.style.transform = `translate(${view.tx + a.x * view.k}px, ${view.ty + a.z * view.k}px)`;
    if (a.far) a.el.style.opacity = far ? 1 : 0;
    if (a.minK) a.el.hidden = view.k < a.minK;
  });
  $('cross').style.left = c.x + 'px'; $('cross').style.top = c.y + 'px';
  updateTiles(r);
  if (!mobile()) { drawRulers(r); drawScale(); }
  updateHud();
  saveHash();
}

/* ---------- тайлы (как в текущем app.js) ---------- */

const tileEls = new Map();
function updateTiles(r) {
  const want = new Set();
  if (world === 'over' && view.k >= .4 / Math.min(devicePixelRatio || 1, 2)) {
    const n = Math.ceil(W().size / TILE);
    const c0 = Math.max(0, Math.floor(-view.tx / view.k / TILE)), c1 = Math.min(n - 1, Math.floor((r.width - view.tx) / view.k / TILE));
    const r0 = Math.max(0, Math.floor(-view.ty / view.k / TILE)), r1 = Math.min(n - 1, Math.floor((r.height - view.ty) / view.k / TILE));
    for (let y = r0; y <= r1; y++) for (let x = c0; x <= c1; x++) want.add(x + '_' + y);
  }
  tileEls.forEach((n, id) => { if (!want.has(id)) { n.remove(); tileEls.delete(id); } });
  want.forEach(id => {
    if (tileEls.has(id)) return;
    const [x, y] = id.split('_').map(Number), S = W().size, n = document.createElement('div');
    n.className = 'tile';
    n.style.cssText = `left:${x * TILE / S * 100}%;top:${y * TILE / S * 100}%;width:${Math.min(S - x * TILE, TILE + 1) / S * 100}%;height:${Math.min(S - y * TILE, TILE + 1) / S * 100}%;background-image:url('${MAP_DIR}tiles/${id}.webp?v=${MAP_VERSION}')`;
    $('tiles').appendChild(n);
    tileEls.set(id, n);
  });
}

/* ---------- линейки, масштаб, HUD ---------- */

const niceStep = minPx => [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000].find(s => s * view.k >= minPx) || 5000;

function drawRulers(r) {
  const R = 22, dpr = devicePixelRatio || 1, step = niceStep(64), half = W().half, zero = css('--zero'), tick = css('--muted');
  [[$('rulerX'), r.width, R, true], [$('rulerZ'), R, r.height, false]].forEach(([c, w, h, horiz]) => {
    c.width = w * dpr; c.height = h * dpr; c.style.width = w + 'px'; c.style.height = h + 'px';
    const ctx = c.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.fillStyle = css('--bg'); ctx.fillRect(0, 0, w, h);
    ctx.font = '500 10px "JetBrains Mono", monospace'; ctx.textBaseline = 'middle';
    const off = horiz ? view.tx : view.ty, len = horiz ? w : h;
    const from = Math.ceil(((0 - off) / view.k - half) / step) * step, to = (len - off) / view.k - half;
    for (let v = from; v <= to; v += step) {
      if (Math.abs(v) > half) continue;
      const p = Math.round(off + (v + half) * view.k);
      if (p < R) continue;
      ctx.fillStyle = v === 0 ? zero : tick;
      if (horiz) { ctx.fillRect(p, R - 6, 1, 6); ctx.fillText(num(v), p + 4, 10); }
      else { ctx.fillRect(R - 6, p, 6, 1); ctx.save(); ctx.translate(10, p - 4); ctx.rotate(-Math.PI / 2); ctx.fillText(num(v), 0, 0); ctx.restore(); }
    }
  });
}

function drawScale() {
  const step = niceStep(70);
  $('scaleLabel').textContent = step + ' блоков';
  $('scaleBar').style.width = step * view.k + 'px';
}

// На компьютере — координаты под курсором, на телефоне — под перекрестием.
let pointer = null;
function updateHud() {
  const r = rect(), c = center(), p = pointer ? { x: pointer.x - r.left, y: pointer.y - r.top } : c;
  const x = Math.floor((p.x - view.tx) / view.k - W().half), z = Math.floor((p.y - view.ty) / view.k - W().half);
  const other = world === 'over' ? `в аду ${num(Math.floor(x / 8))} / ${num(Math.floor(z / 8))}` : `наверху ${num(x * 8)} / ${num(z * 8)}`;
  const q = world === 'over' && Math.abs(x) <= W().half && Math.abs(z) <= W().half ? gubOf(x, z) : null;
  $('hud').innerHTML = `X ${num(x)}  Z ${num(z)}\n<span>${other}</span>` + (q ? `\n<b style="color:${q.color}">■</b> ${q.name}` : '');
}

let hashTimer;
function saveHash() {
  clearTimeout(hashTimer);
  hashTimer = setTimeout(() => {
    const c = center(), x = Math.round((c.x - view.tx) / view.k - W().half), z = Math.round((c.y - view.ty) / view.k - W().half);
    history.replaceState(null, '', `#${world}/${x}/${z}/${(view.k / view.fitK).toFixed(2)}`);
  }, 250);
}

/* ============ ввод на карте ============ */

const pts = new Map();
let moved = 0, pinch = null;
const v = $('view');

v.addEventListener('pointerdown', e => {
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  v.setPointerCapture(e.pointerId);
  moved = 0; pinch = null;
  v.classList.add('dragging');
  $('tip').hidden = true;
  $('q').blur();
  if (sheet.state !== 'peek') setSheet('peek');
});
v.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse') pointer = { x: e.clientX, y: e.clientY };
  if (!pts.has(e.pointerId)) { updateHud(); hover(e); return; }
  const prev = pts.get(e.pointerId);
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pts.size >= 2) {
    const [a, b] = [...pts.values()], d = Math.hypot(a.x - b.x, a.y - b.y), r = rect();
    if (pinch) zoomAt((a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top, d / pinch);
    pinch = d; moved = 99;
    return;
  }
  moved += Math.abs(e.clientX - prev.x) + Math.abs(e.clientY - prev.y);
  view.tx += e.clientX - prev.x; view.ty += e.clientY - prev.y;
  apply();
});
function up(e) {
  const tap = pts.size === 1 && moved <= 14;
  pts.delete(e.pointerId);
  if (pts.size < 2) pinch = null;
  if (!pts.size) v.classList.remove('dragging');
  if (!tap) return;
  // Захват указателя ломает обычный click по вложенным фигурам — ищем цель сами.
  const hit = document.elementFromPoint(e.clientX, e.clientY);
  const key = hit && hit.closest('[data-sel]');
  select(key ? registry.get(key.dataset.sel) : null);
}
v.addEventListener('pointerup', up);
v.addEventListener('pointercancel', up);
v.addEventListener('pointerleave', () => { pointer = null; $('tip').hidden = true; updateHud(); });
v.addEventListener('wheel', e => {
  e.preventDefault();
  const r = rect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * .0016));
}, { passive: false });
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => v.addEventListener(t, e => e.preventDefault()));

function hover(e) {
  const n = e.target.closest && e.target.closest('[data-sel]'), o = n && registry.get(n.dataset.sel), tip = $('tip');
  if (!o || o.type === 'station' || e.pointerType !== 'mouse') { tip.hidden = true; return; }
  const r = $('map').getBoundingClientRect();
  tip.hidden = false;
  tip.style.left = e.clientX - r.left + 'px'; tip.style.top = e.clientY - r.top + 'px';
  tip.innerHTML = esc(o.name) + `<small>${o.type === 'terr' ? esc(o.owner) + ' · ' + o.residents.length + ' жит.' : o.type === 'boss' ? 'босс' : 'портал хайперлупа'}</small>`;
}

$('zin').onclick = () => { const c = center(); zoomAt(c.x, c.y, 1.6); };
$('zout').onclick = () => { const c = center(); zoomAt(c.x, c.y, 1 / 1.6); };
$('zfit').onclick = fit;
window.addEventListener('keydown', e => { if (e.key === 'Escape') select(null); if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); } });

/* ============ шторка на телефоне ============ */

const sheet = { state: 'peek', y: 0 };
const peekH = () => $('scroll').offsetTop + 2;
function snapY(state) {
  const h = $('side').offsetHeight;
  return { full: 0, half: Math.max(0, h - innerHeight * .52), peek: h - peekH() }[state];
}
function setSheet(state) {
  sheet.state = state;
  sheet.y = snapY(state);
  $('side').style.setProperty('--y', sheet.y + 'px');
  document.documentElement.style.setProperty('--peek', peekH() + 'px');
}
{
  const grab = $('grab'), side = $('side');
  let start = null;
  grab.addEventListener('pointerdown', e => { start = { py: e.clientY, y: sheet.y, moved: 0 }; grab.setPointerCapture(e.pointerId); side.classList.add('dragging'); });
  grab.addEventListener('pointermove', e => {
    if (!start) return;
    const dy = e.clientY - start.py;
    start.moved = Math.max(start.moved, Math.abs(dy));
    sheet.y = Math.max(0, Math.min(snapY('peek'), start.y + dy));
    side.style.setProperty('--y', sheet.y + 'px');
  });
  const end = () => {
    if (!start) return;
    side.classList.remove('dragging');
    if (start.moved < 6) setSheet({ peek: 'half', half: 'full', full: 'peek' }[sheet.state]);
    else setSheet(['full', 'half', 'peek'].sort((a, b) => Math.abs(snapY(a) - sheet.y) - Math.abs(snapY(b) - sheet.y))[0]);
    start = null;
  };
  grab.addEventListener('pointerup', end);
  grab.addEventListener('pointercancel', end);
  $('q').addEventListener('focus', () => { if (mobile()) setSheet('full'); });
}

/* ============ карточка ============ */

function select(o) {
  selected = o || null;
  markSelected();
  const card = $('card');
  card.hidden = !o;
  document.body.classList.toggle('has-card', !!o);
  if (!o) { apply(); return; }
  const g = o.group, tag = { terr: 'Территория', boss: 'Босс', station: 'Станция хайперлупа', exit: 'Портал хайперлупа' }[o.type];
  let rows = '', extra = '', second = '<button data-act="xyz">Скопировать X Z</button>';
  const row = (k, val) => rows += `<dt>${k}</dt><dd>${val}</dd>`;
  if (o.type === 'terr') {
    row('Границы', `X ${num(o.b.x1)} … ${num(o.b.x2)}<br>Z ${num(o.b.z1)} … ${num(o.b.z2)}`);
    row('Размер', `${o.b.x2 - o.b.x1 + 1} × ${o.b.z2 - o.b.z1 + 1}`);
    row('В аду это', `${num(o.cx / 8)} / ${num(o.cz / 8)}`);
    extra = `<h4>Жители · ${o.residents.length}</h4><ul>` + o.residents.map(r => `<li>${esc(r.name)}<span>${ROLES[r.status] || esc(r.status)}</span></li>`).join('') + '</ul>';
  } else if (o.type === 'boss') {
    row('Координаты', `${num(o.x)} / ${num(o.z)}`);
    row('В аду это', `${num(o.x / 8)} / ${num(o.z / 8)}`);
    row('Ближайший портал', nearestStation(o.x, o.z));
  } else {
    const nx = o.type === 'exit' ? o.nx : o.x, nz = o.type === 'exit' ? o.nz : o.z;
    row('В аду', `${num(nx)} / ${num(nz)}`);
    row('В верхнем мире', `${num(nx * 8)} / ${num(nz * 8)}`);
    if (g) row('Ветка', `${g.name}, ${g.dir}`);
    second = `<button data-act="swap">${world === 'over' ? 'Открыть схему' : 'Показать наверху'}</button>`;
  }
  const where = g ? (o.type === 'terr' || o.type === 'boss' ? ` · ${g.name} губерния` : ` · ${g.name} ветка`) : '';
  card.style.setProperty('--c', g ? g.color : '#DEFFEA');
  card.innerHTML = `<header><div class="tag">${tag}${where}</div><h2>${esc(o.name)}</h2><button class="x" data-act="close" aria-label="Закрыть">✕</button></header>` +
    `<div class="body">${o.about ? `<p>${esc(o.about)}</p>` : ''}<dl>${rows}</dl>${extra}</div>` +
    `<footer><button data-act="copy">Скопировать ссылку</button>${second}</footer>`;
}

// Показывает объект в свободной от карточки части экрана.
function focusOn(o) {
  select(o);
  if (o.type === 'terr') fitTo(o.b.x1 - 40, o.b.z1 - 40, o.b.x2 + 41, o.b.z2 + 41, 3);
  else goto(o.x, o.z, Math.max(view.k, world === 'over' ? .8 : view.fitK * 2));
}

function nearestStation(x, z) {
  const d = s => Math.hypot(s.x * 8 - x, s.z * 8 - z), s = stations.slice().sort((a, b) => d(a) - d(b))[0];
  return s ? `${esc(s.name)}<br>${Math.round(d(s))} бл.` : '—';
}

$('card').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const o = selected, act = b.dataset.act;
  if (act === 'close') select(null);
  if (act === 'copy') copy(location.href, b);
  if (act === 'xyz') copy(o.type === 'terr' ? `${o.cx} ~ ${o.cz}` : `${o.x} ~ ${o.z}`, b);
  if (act === 'swap') {
    const key = o.type === 'exit' ? o.key.slice(1) : 'e' + o.key;
    setWorld(world === 'over' ? 'nether' : 'over');
    if (registry.has(key)) focusOn(registry.get(key));
  }
});
function copy(text, btn) {
  const done = () => { const t = btn.textContent; btn.textContent = 'Скопировано'; setTimeout(() => btn.textContent = t, 1200); };
  navigator.clipboard ? navigator.clipboard.writeText(text).then(done, done) : done();
}

/* ============ панель ============ */

function renderSide() {
  const over = world === 'over';
  $('layers').innerHTML = over ? Object.keys(layers).map(k => {
    const n = { gub: 4, terr: territories.length, boss: BOSSES.length, loop: stations.length - 1 }[k];
    return `<button class="chip" data-layer="${k}" aria-pressed="${layers[k]}">${LAYER_NAMES[k]}<i>${n}</i></button>`;
  }).join('') : LINES.map(l => `<button class="chip" data-group="${l.id}" aria-pressed="${groupFilter === l}" style="${groupFilter === l ? 'background:' + l.color : ''}">${l.name}<i>${l.dir}</i></button>`).join('');
  $('gubs').parentElement.hidden = !over;
  $('gubs').innerHTML = GUBS.map(g =>
    `<button class="gub" data-group="${g.id}" style="--c:${g.color}" aria-pressed="${groupFilter === g}">${g.name}<small>${territories.filter(t => t.group === g).length} терр.</small></button>`).join('');
  $('listTitle').textContent = over ? 'Территории' : 'Станции';
  $('q').placeholder = over ? 'Территория, владелец, житель' : 'Название станции';
  renderList();
  if (mobile()) setSheet(sheet.state);
}

function renderList() {
  const q = $('q').value.trim().toLowerCase();
  const src = world === 'over' ? territories : stations;
  const out = src.filter(o => (!groupFilter || o.group === groupFilter) && (!q || (o.hay || o.name.toLowerCase()).includes(q)));
  $('found').textContent = 'найдено: ' + out.length;
  $('clearFilter').hidden = !groupFilter && !q;
  $('list').innerHTML = out.map(o => {
    const c = o.group ? o.group.color : '#DEFFEA';
    const sub = o.type === 'terr' ? `${esc(o.owner)} · ${o.residents.length} жит.` : o.hub ? 'все четыре ветки' : `${o.group.name} ветка`;
    const xy = o.type === 'terr' ? `${num(o.cx)}<br>${num(o.cz)}` : `${num(o.x)}<br>${num(o.z)}`;
    return `<button class="item" style="--c:${c}" data-key="${o.key}"><strong>${esc(o.name)}</strong><span>${sub}</span><em>${xy}</em></button>`;
  }).join('') || '<div class="empty">Ничего не нашлось.</div>';
}

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if ('acct' in b.dataset) openAuth();
  if (b.dataset.auth === 'close') $('auth').hidden = true;
  if (b.dataset.auth === 'logout') logout();
  if ('themeToggle' in b.dataset) { setTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'); apply(); }
  if (b.dataset.world) setWorld(b.dataset.world);
  if (b.dataset.layer) { layers[b.dataset.layer] = !layers[b.dataset.layer]; renderSide(); rebuild(); }
  if (b.dataset.group) {
    const g = (world === 'over' ? GUBS : LINES).find(x => x.id === b.dataset.group), h = W().half;
    groupFilter = groupFilter === g ? null : g;
    renderSide();
    if (world === 'over') {
      if (mobile()) setSheet('half');
      groupFilter ? fitTo(g.sx < 0 ? -h : 0, g.sz < 0 ? -h : 0, g.sx < 0 ? 0 : h, g.sz < 0 ? 0 : h) : fit();
    }
  }
  if (b.id === 'clearFilter') { groupFilter = null; $('q').value = ''; renderSide(); }
  if (b.dataset.key) {
    $('q').blur();
    setSheet('peek');
    focusOn((world === 'over' ? territories : stations).find(x => x.key === b.dataset.key));
  }
});
$('q').addEventListener('input', renderList);

function setWorld(w) {
  world = w; groupFilter = null; select(null);
  document.querySelectorAll('[data-world]').forEach(b => b.setAttribute('aria-pressed', b.dataset.world === w));
  $('stage').style.backgroundImage = w === 'over' ? `url('${MAP_DIR}low.webp?v=${MAP_VERSION}'), url('${MAP_DIR}preview.webp?v=${MAP_VERSION}')` : '';
  $('stage').style.backgroundSize = '';
  renderSide(); rebuild(); fit();
}

function relayout() {
  setSheet(mobile() ? sheet.state : 'peek');
  const atFit = view.k <= view.fitK * 1.01;
  view.fitK = worldFitK();
  atFit ? fit() : apply();
}
window.addEventListener('resize', relayout);

/* ============ вход ============ */

// auth === null — сервер входа недоступен (например, сайт открыт как статика).
let auth = null, authError = '';
const PROVIDER_NAMES = { discord: 'Discord', telegram: 'Telegram' };

function loadMe() {
  return fetch('/api/me', { credentials: 'same-origin' })
    .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
    .then(data => { auth = data; })
    .catch(() => { auth = null; })
    .then(renderAcct);
}

function renderAcct() {
  const user = auth && auth.user;
  document.querySelectorAll('[data-acct]').forEach(b => {
    b.classList.toggle('in', !!user);
    if (user && user.avatar) b.innerHTML = `<img src="${esc(user.avatar)}" alt="">`;
  });
}

function openAuth() {
  const box = $('authBox'), user = auth && auth.user, close = '<button class="x" data-auth="close" aria-label="Закрыть">✕</button>';
  if (user) {
    const mp = user.mp
      ? `Аккаунт Multi Punk: <b>${esc(user.mp.nick || user.mp.login)}</b>`
      : 'Привязка к аккаунту Multi Punk пока не проверяется.';
    box.innerHTML = `<h2>Аккаунт</h2>${close}<div class="who">${user.avatar ? `<img src="${esc(user.avatar)}" alt="">` : ''}` +
      `<div><b>${esc(user.name)}</b><span>вход через ${PROVIDER_NAMES[user.provider] || esc(user.provider)}</span></div></div>` +
      `<p class="note">${mp}</p><button class="way main" data-auth="logout">Выйти</button>`;
  } else {
    const p = auth ? auth.providers : {};
    box.innerHTML = `<h2>Вход</h2>${close}` +
      (authError === 'denied' ? '<p class="err">Вход пока открыт только для своих — этого аккаунта нет в списке.</p>' : authError ? '<p class="err">Войти не получилось. Попробуй ещё раз.</p>' : '') +
      '<p>Войди через соцсеть, которая привязана к твоему аккаунту Multi Punk.</p>' +
      (p.discord ? '<a class="way discord" href="/api/auth/discord" data-login>Войти через Discord</a>' : '<div class="way off">Discord не настроен</div>') +
      (p.telegram ? '<div id="tgSlot"></div>' : '<div class="way off">Telegram не настроен</div>') +
      (auth ? '' : '<p class="note">Сервер входа недоступен: страница открыта без функций Vercel.</p>');
    if (p.telegram) {
      // Кнопку Telegram рисует его собственный скрипт; после входа он сам уводит на data-auth-url.
      const s = document.createElement('script');
      s.async = true;
      s.src = 'https://telegram.org/js/telegram-widget.js?22';
      s.dataset.telegramLogin = p.telegram;
      s.dataset.size = 'large';
      s.dataset.radius = '5';
      s.dataset.authUrl = location.origin + '/api/auth/telegram';
      $('tgSlot').appendChild(s);
    }
  }
  // Сервер вернёт сюда же, с тем же местом на карте.
  document.cookie = 'mp_next=' + encodeURIComponent(location.pathname + location.hash) + '; Path=/; Max-Age=600; SameSite=Lax';
  $('auth').hidden = false;
}

function logout() {
  fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' }).then(() => location.reload());
}

$('auth').addEventListener('click', e => { if (e.target === $('auth')) $('auth').hidden = true; });

/* ============ запуск ============ */

loadMe().then(() => {
  const params = new URLSearchParams(location.search);
  if (!params.get('auth')) return;
  authError = params.get('auth');
  history.replaceState(null, '', location.pathname + location.hash);
  openAuth();
});

const json = url => fetch(url).then(r => r.ok ? r.json() : Promise.reject(new Error(url + ' ' + r.status)));

json(MAP_DIR + 'meta.json').then(m => {
  MAP_VERSION = m.version || 0; TILE = m.tile;
  WORLDS.over.size = m.width; WORLDS.over.half = Math.floor(m.width / 2);
  const d = new Date(MAP_VERSION * 1000);
  $('stamp').textContent = 'Макет: станции хайперлупа выдуманы. ' + (isNaN(d) ? '' : 'Снимок карты: ') + d.toLocaleString('ru', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
}).catch(() => {})
  .then(() => json('/api/regions').catch(() => json('region.json')))
  .then(raw => { territories = raw.map(buildTerritory); })
  .catch(err => console.error(err))
  .then(() => {
    buildDemoLoop();
    const h = location.hash.slice(1).split('/');
    setWorld(h[0] === 'nether' ? 'nether' : 'over');
    if (h.length === 4 && h.slice(1).every(n => isFinite(n))) goto(+h[1], +h[2], view.fitK * Math.max(.7, +h[3]));
  });
</script>
</body>
</html>
