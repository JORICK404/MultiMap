<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Вход — карта Multi Punk</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#150C61">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Единственная страница, которую видно без входа: ни карты, ни данных здесь нет.
   Окно — как окно входа на multi-punk.net: сплошное синее, одинаковое в обеих темах. */
:root {
  --bg: #150C61; --text: #DEFFEA; --muted: #C9C6FA; --accent: #76FFAA; --line: rgba(255, 255, 255, .2);
  --grad: linear-gradient(100deg, #1B107C 1%, #2E22C9 100%);
  --bar: linear-gradient(90deg, #76FFAA 0%, #65D6FF 45%, #DEFFEA 100%);
  --logo: brightness(0) invert(1);
}
:root[data-theme="light"] { --bg: #FFFFFF; --logo: none; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  display: grid; place-items: center; gap: 22px; align-content: center;
  min-height: 100dvh; padding: 24px 16px;
  background: var(--bg); color: #fff;
  font: 500 14px/1.45 Montserrat, system-ui, sans-serif;
}
.logo { height: 22px; filter: var(--logo); }
main { width: min(100%, 360px); padding: 26px 24px 24px; background: #3530C8; border-radius: 20px; }
h1 { margin: 0; font-size: 22px; font-weight: 800; }
h1::after { content: ''; display: block; height: 5px; margin-top: 10px; border-radius: 3px; background: var(--bar); }
p { margin: 14px 0; }
.note { font-size: 12px; color: var(--muted); }
.err { padding: 8px 12px; border-radius: 6px; background: rgba(255, 90, 82, .25); }
.way { display: flex; align-items: center; justify-content: center; width: 100%; height: 46px; margin-top: 8px; border-radius: 5px; font-weight: 700; text-decoration: none; }
.way.discord { background: #5865F2; color: #fff; }
.way.main { margin: 0 0 14px; background: var(--accent); color: #000; }
.way.off { box-shadow: inset 0 0 0 2px var(--line); color: var(--muted); }
#tgSlot { display: grid; place-items: center; min-height: 46px; margin-top: 8px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<img class="logo" src="assets/logo.svg" alt="Multi Punk">
<main>
  <h1>Карта сервера</h1>
  <p id="err" class="err" hidden></p>
  <a id="toSite" class="way main" href="https://multi-punk.ru" hidden>Перейти на multi-punk.ru</a>
  <p>Карта открыта для игроков с подпиской. Войди через соцсеть, которая привязана к твоему аккаунту Multi Punk.</p>
  <div id="ways"></div>
  <p id="note" class="note" hidden></p>
</main>

<script>
try { if (localStorage.getItem('theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}

const $ = id => document.getElementById(id);
const ERRORS = {
  notfound: 'Не нашли аккаунт Multi Punk, к которому привязана эта соцсеть. Привяжи её в профиле на основном сайте и возвращайся.',
  nosub: 'Карта доступна только с платной подпиской Multi Punk. Оформить её можно на основном сайте.',
  unavailable: 'Не получилось проверить аккаунт: сервер Multi Punk не ответил. Попробуй позже.',
  denied: 'Этого аккаунта нет в списке допущенных.',
  failed: 'Войти не получилось. Попробуй ещё раз.',
  'tg-expired': 'Telegram прислал устаревшее подтверждение. Попробуй войти ещё раз.',
  'ds-cancelled': 'Вход через Discord отменён.',
};

const reason = new URLSearchParams(location.search).get('auth');
if (reason) {
  // У непредвиденных сбоев показываем код — по нему видно, на каком шаге сломалось.
  $('err').textContent = ERRORS[reason] || `${ERRORS.failed} (код: ${reason})`;
  $('err').hidden = false;
  $('toSite').hidden = reason !== 'notfound' && reason !== 'nosub';
  history.replaceState(null, '', location.pathname);
}

fetch('/api/me', { credentials: 'same-origin' })
  .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
  .then(me => {
    // Уже вошёл — на карту. Сервер помнит, куда человек шёл, только при самом входе.
    if (me.user && !reason) { location.replace('/'); return; }

    const ways = $('ways');
    ways.innerHTML =
      (me.providers.discord ? '<a class="way discord" href="/api/auth/discord">Войти через Discord</a>' : '<div class="way off">Discord не настроен</div>') +
      (me.providers.telegram ? '<div id="tgSlot"></div>' : '<div class="way off">Telegram не настроен</div>');

    if (me.providers.telegram) {
      // Кнопку Telegram рисует его собственный скрипт. Данные входа он отдаёт нашей функции,
      // и на сервер переходит уже сама страница: если поручить переход виджету (data-auth-url),
      // браузер блокирует его после закрытия окна подтверждения, и вход срабатывает через раз.
      window.onTelegramAuth = user => {
        // Пустые поля (нет фамилии, нет фото) пропускаем: в подписи Telegram их тоже нет.
        const fields = Object.entries(user).filter(([, v]) => v !== null && v !== undefined);
        location.href = '/api/auth/telegram?' + new URLSearchParams(fields);
      };
      const s = document.createElement('script');
      s.async = true;
      s.src = 'https://telegram.org/js/telegram-widget.js?22';
      s.dataset.telegramLogin = me.providers.telegram;
      s.dataset.size = 'large';
      s.dataset.radius = '5';
      s.dataset.onauth = 'onTelegramAuth(user)';
      $('tgSlot').appendChild(s);
    }
    if (me.missing && me.missing.length) {
      $('note').textContent = `На сервере (окружение ${me.env}) не заданы: ${me.missing.join(', ')}`;
      $('note').hidden = false;
    }
  })
  .catch(() => {
    $('note').textContent = 'Сервер входа недоступен. Попробуй обновить страницу позже.';
    $('note').hidden = false;
  });
</script>
</body>
</html>
